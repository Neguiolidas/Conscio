[build]
  command = "cd site/conscio-website && npm install && npm run build"
  publish = "site/conscio-website/dist"

# Security headers — applied globally (pentest 2026-08-25)
# Fixes: clickjacking (X-Frame-Options), MIME sniffing (X-Content-Type-Options),
# referrer leak (Referrer-Policy), feature abuse (Permissions-Policy), XSS
# hardening (Content-Security-Policy).
# NOTE: style-src 'unsafe-inline' is REQUIRED — framer-motion/React write
# inline style attributes at runtime; removing it breaks all animations.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), autoplay=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Assets: cache immutable (fingerprinted by Vite build hash)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false