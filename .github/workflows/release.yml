name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-trigger. A tag push is a webhook event, and webhooks are the first
  # thing GitHub throttles during an Actions incident — v4.0.0's tag landed and
  # produced no run at all, which is indistinguishable from a run that has not
  # started yet. workflow_dispatch goes through the API instead, so it still
  # works when push triggers are being dropped, and it re-runs a release without
  # deleting and recreating the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v4.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Gate: the same discipline as CI — per-file test loop + lint + types — must
  # pass before anything is built or published.
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # On a tag push github.ref is the tag and `inputs.tag` is empty. On a
      # dispatch github.ref is the branch the run was started from, which would
      # silently build that branch's version instead of the tag's — so the tag
      # input wins whenever it is present.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests (one file at a time)
        run: |
          set -euo pipefail
          for f in tests/test_*.py; do
            echo "── $f"
            python -m pytest "$f" -q --tb=short -p no:cacheprovider \
              || { rc=$?; [ "$rc" -eq 5 ] && echo "  (no tests collected — ok)" || exit "$rc"; }
          done
      - name: Lint + types
        run: |
          ruff check conscio/ tests/
          pyright conscio/

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build + check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # A tag push cannot disagree with itself, but a dispatch can be given any
      # tag, and PyPI uploads are permanent. Refuse before publish rather than
      # discover the mismatch in the release history.
      - name: Tag and package version must agree
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag_version="${ref#v}"
          pkg_version="$(python -c 'import re,pathlib;
          print(re.search(r"__version__ = \"([^\"]+)\"",
                pathlib.Path("conscio/__init__.py").read_text()).group(1))')"
          echo "tag=$tag_version  package=$pkg_version"
          [ "$tag_version" = "$pkg_version" ] || {
            echo "::error::tag $ref does not match __version__ $pkg_version"; exit 1; }
          ls dist/ | grep -q "conscio-${pkg_version}-py3-none-any.whl" || {
            echo "::error::no wheel for $pkg_version in dist/"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # OIDC trusted publishing — no API token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Publish is retried up to 3x. Root cause of past failures wasn't OIDC/
      # trusted-publisher config (that part always worked) — it was
      # ConnectionResetError talking to sigstore's Fulcio/Rekor during PEP 740
      # attestation signing, a transient network blip. skip-existing makes
      # retries safe if a prior attempt already uploaded the file before
      # failing on the attestation step.
      - name: Publish to PyPI (attempt 1)
        id: publish1
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          skip-existing: true

      - name: Wait before retry 2
        if: steps.publish1.outcome == 'failure'
        run: sleep 30

      - name: Publish to PyPI (attempt 2)
        id: publish2
        if: steps.publish1.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          skip-existing: true

      - name: Wait before retry 3
        if: steps.publish1.outcome == 'failure' && steps.publish2.outcome == 'failure'
        run: sleep 60

      - name: Publish to PyPI (attempt 3)
        if: steps.publish1.outcome == 'failure' && steps.publish2.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # The Release page is the user-facing announcement, so it comes after publish:
  # announcing a version that never reached PyPI is worse than announcing nothing.
  github_release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create/edit the Release and upload its assets
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Notes are the CHANGELOG section for this exact version. A missing or
      # empty section means the heading format drifted, and a release page
      # published with silently empty notes is precisely the failure this job
      # exists to prevent — so fail loudly rather than announce nothing.
      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          python3 - "$ref" <<'PY'
          import pathlib, re, sys

          ref = sys.argv[1]
          version = ref[1:] if ref.startswith("v") else ref
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()

          start = next((i for i, ln in enumerate(lines)
                        if ln.startswith(f"## [{version}]")), None)
          if start is None:
              sys.exit(f"::error::CHANGELOG.md has no '## [{version}]' section")
          end = next((i for i in range(start + 1, len(lines))
                      if lines[i].startswith("## [")), len(lines))

          body = "\n".join(lines[start + 1:end]).strip()
          if not body:
              sys.exit(f"::error::CHANGELOG section for {version} is empty")

          # "## [4.0.1] - 2026-08-07 — The plugin records again" → the title tail.
          m = re.match(r"## \[[^\]]+\][^—]*—\s*(.+)", lines[start])
          title = f"{ref} — {m.group(1).strip()}" if m else ref

          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          pathlib.Path("release-title.txt").write_text(title, encoding="utf-8")
          print(f"title: {title}\n{len(body.splitlines())} lines of notes")
          PY

      # A re-trigger must converge, not fail at the last step: `gh release create`
      # errors when the release already exists, and this workflow deliberately
      # supports re-running a release via workflow_dispatch. Both titles and notes
      # are read from files rather than interpolated into the command, so CHANGELOG
      # prose can never be spliced into the shell.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          title="$(cat release-title.txt)"
          if gh release view "$ref" >/dev/null 2>&1; then
            gh release edit "$ref" --title "$title" --notes-file release-notes.md
            gh release upload "$ref" dist/* --clobber
            echo "updated existing release $ref"
          else
            gh release create "$ref" dist/* --title "$title" --notes-file release-notes.md
            echo "created release $ref"
          fi
