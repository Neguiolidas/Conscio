<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="color-scheme" content="dark">
	<title>Conscio Observatory</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='18' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg-grid"></div>
<div class="app">
	<aside id="sidebar">
		<div class="sidebar-section">
			<div class="sidebar-label">Monitoring</div>
			<button class="nav-item is-active" data-tab="overview">
				<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18"/></svg>
				Overview
			</button>
			<button class="nav-item" data-tab="agents">
				<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
				Agents
				<span class="nav-count" data-count="agents">0</span>
			</button>
			<button class="nav-item" data-tab="daemon">
				<svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
				Daemon
			</button>
		</div>
		<div class="sidebar-section">
			<div class="sidebar-label">Relay (v4.5)</div>
			<button class="nav-item" data-tab="halls">
				<svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>
				Halls
				<span class="nav-count" data-count="halls">0</span>
			</button>
			<button class="nav-item" data-tab="mailboxes">
				<svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
				Mailboxes
				<span class="nav-count" data-count="mailboxes">0</span>
			</button>
			<button class="nav-item" data-tab="relay">
				<svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
				Relay inbox
			</button>
		</div>
		<div class="sidebar-section">
			<div class="sidebar-label">Identity</div>
			<button class="nav-item" data-tab="identity">
				<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1M16 4a4 4 0 0 1 0 7.5"/></svg>
				Identity
			</button>
		</div>
		<div class="sidebar-section">
			<div class="sidebar-label">Society</div>
			<button class="nav-item" data-tab="society">
				<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="7" cy="9" r="3"/><circle cx="17" cy="9" r="3"/><path d="M2 19a5 5 0 0 1 10 0M12 19a5 5 0 0 1 10 0"/></svg>
				Members
			</button>
			<button class="nav-item" data-tab="society-skills">
				<svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2l3 6 6 .9-4.5 4.4 1 6.7L12 17l-5.5 3 1-6.7L3 8.9 9 8z"/></svg>
				Skills
			</button>
			<button class="nav-item" data-tab="society-records">
				<svg class="nav-icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
				Records
			</button>
		</div>
		<div class="sidebar-section">
			<div class="sidebar-label">Activity</div>
			<button class="nav-item" data-tab="events">
				<svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
				Events
			</button>
			<button class="nav-item" data-tab="actions">
				<svg class="nav-icon" viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>
				Actions
			</button>
			<button class="nav-item" data-tab="goals">
				<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
				Goals
			</button>
			<button class="nav-item" data-tab="skills">
				<svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
				Skills
			</button>
		</div>
		<div class="sidebar-section">
			<div class="sidebar-label">Knowledge</div>
			<button class="nav-item" data-tab="kg-entities">
				<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><path d="M9 7l6 0M8 9l3 7M16 9l-3 7"/></svg>
				Entities
			</button>
			<button class="nav-item" data-tab="kg-relationships">
				<svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>
				Relationships
			</button>
			<button class="nav-item" data-tab="kg-timeline">
				<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
				Timeline
			</button>
			<button class="nav-item" data-tab="structural">
				<svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 3v18h18M7 16l3-4 4 3 5-7"/></svg>
				Drift
			</button>
			<button class="nav-item" data-tab="graphview">
				<svg class="nav-icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6 8v4a3 3 0 0 0 3 3M18 8v4a3 3 0 0 1-3 3"/></svg>
				Graph
			</button>
		</div>
	</aside>
	<header id="topbar">
		<div class="brand">
			<div class="brand-mark">C</div>
			<span class="brand-title">Conscio</span>
			<span class="brand-meta" id="brand-meta">Observatory · v4.5</span>
		</div>
		<div class="topbar-spacer"></div>
		<span class="status-pill" id="status-live"><span class="dot"></span><span id="status-text">connecting</span></span>
		<span class="status-pill" id="status-version"><span id="version-text">v—</span></span>
		<span class="status-pill" id="status-storage" title="Liaison DB"><span class="dot"></span><span id="storage-text">—</span></span>
	</header>
	<main id="main">
		<header class="page-head">
			<h1 class="page-title" id="page-title">Overview</h1>
			<span class="page-subtitle" id="page-subtitle">live</span>
		</header>
		<div id="content"></div>
	</main>
</div>
<script src="/static/d3.min.js"></script>
<script src="/static/graphview.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
