[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conscio"
dynamic = ["version"]
description = "Self-awareness framework for AI agents — emergent consciousness via context-aware memory, introspection, and goal generation"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
 "numpy>=1.24",
]
authors = [
 {name = "Neguiolidas", email = "neguitech@proton.me"},
]
keywords = ["ai", "consciousness", "agents", "introspection", "meta-cognition"]
classifiers = [
 "Development Status :: 4 - Beta",
 "Intended Audience :: Developers",
 "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
 "Programming Language :: Python :: 3",
 "Programming Language :: Python :: 3.10",
 "Programming Language :: Python :: 3.11",
 "Programming Language :: Python :: 3.12",
 "Programming Language :: Python :: 3.13",
 "Topic :: Scientific/Engineering :: Artificial Intelligence",
 "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Neguiolidas/Conscio"
Repository = "https://github.com/Neguiolidas/Conscio"
Issues = "https://github.com/Neguiolidas/Conscio/issues"
Changelog = "https://github.com/Neguiolidas/Conscio/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.8",
  "pyright>=1.1.350",
  "bandit>=1.7",
  "vulture>=2.1",
  "pyyaml>=6.0",
  "build>=1.0",  # tests/test_packaging_assets.py builds a real wheel
]
docs = [
 "mkdocs-material>=9.5",
]

[project.scripts]
conscio = "conscio.cli:main"
conscio-bench = "conscio.bench:main"
conscio-daemon = "conscio.daemon:main"
conscio-mcp = "conscio.mcp.server:main"
conscio-hub = "conscio.hub.server:main"
conscio-observatory = "conscio.observatory.server:main"

[project.entry-points."conscio.sensors"]
host = "conscio.perception.host_sensor:HostSensor"
agent = "conscio.perception.agent_sensor:AgentSensor"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["conscio*"]

[tool.setuptools.dynamic]
version = {attr = "conscio.__version__"}

# `**/*` does not match dotfiles or dot-directories, and setuptools says nothing
# when it skips them: without the two explicit entries below the wheel builds
# clean and the plugin is simply inert, having lost plugin.json and .mcp.json.
[tool.setuptools.package-data]
conscio = [
  "py.typed",
  "hub/static/*",
  "observatory/static/*",
  "integrations/claude_code/assets/**/*",
  "integrations/claude_code/assets/.mcp.json",
  "integrations/claude_code/assets/.claude-plugin/*",
  "USAGE.md",
]

# The asset glob is recursive and reads the working tree, so a developer who
# has ever run the hook ships their own __pycache__ — v3.9.2 carried a 3.14
# .pyc to every user, including the ones on 3.10.
[tool.setuptools.exclude-package-data]
conscio = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

# ── pyright (type checker — substitui mypy) ─────────────────────────
# ── ruff (linter) ───────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Rules that fail across the existing codebase — pre-existing patterns
# (defensive exception handling, naive datetime in non-prod paths, etc.)
ignore = [
  "BLE001",   # blind except — intentional defensive pattern throughout
  "DTZ001",   # datetime() without tzinfo — test fixtures only
  "DTZ005",   # datetime.now() without tz — non-prod paths, tests
  "DTZ006",   # datetime.fromtimestamp without tz — test fixtures
  "S110",     # try-except-pass — defensive logging elsewhere
  "S112",     # try-except-continue — relay/daemon resilience
  "TRY004",   # ValueError vs TypeError — existing API contract
  "RUF012",   # mutable class attr default — intentional in stubs/tests
  "LOG015",   # root logger warning — content_layer uses stdlib logging
  "PLW1510",  # subprocess.run without check — intentionally permissive in tests
  "SIM102",   # nested if — readability in import-scan tests
  "SIM113",   # enumerate vs manual count — intercepter counter logic
  "B017",     # pytest.raises(Exception) — frozen dataclass test
  "EXE001",   # shebang — hooks need it
]

[tool.pyright]
include = ["conscio"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportPossiblyUnboundVariable = "error"
reportOptionalMemberAccess = "error"
reportIncompatibleMethodOverride = "warning"
reportMissingImports = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"

# ── bandit (security linter) ────────────────────────────────────────
[tool.bandit]
targets = ["conscio"]
severity = "medium"
confidence = "medium"
skips = [
  "B101",  # assert_used — pytest usa assert natural
  "B113",  # request_without_timeout — RAG factory tem timeout explicito
]

# ── vulture (dead code finder) ──────────────────────────────────────
[tool.vulture]
paths = ["conscio"]
min_confidence = 60
# Métodos do_HTTP* são dispatch do BaseHTTPRequestHandler — não são "mortos"
# row_factory é sqlite3 idiom — atribuição tem efeito colateral
# Funções de API pública podem ser chamadas externamente
exclude = [
  "conscio/observatory/server.py",
  "conscio/session_lifecycle.py",
]
