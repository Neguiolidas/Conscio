site_name: Conscio
site_description: Self-awareness framework for AI agents — reflect (passive) + act (audited).
repo_url: https://github.com/Neguiolidas/Conscio
repo_name: Neguiolidas/Conscio
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Light mode

# Keep internal / forward-looking material out of the public site.
# Keep in step with the internal-notes block in .gitignore: git ignoring a file
# does not stop mkdocs from publishing it, because the build reads the disk.
exclude_docs: |
  superpowers/
  noosphere/
  patterns/
  roadmap.md
  blueprint*.md
  *-prompt*.md
  *-analysis*.md
  fable*.md
  AUDIT-*.md
  REPORT_*.md
  Report-*.md
  Knolayer.md
  f3-*.md
  verdent-*.md
  reference/conscio_functions.md
  reference/claude-code-harness.md
  RELEASING.md
  AUDIT-*.md
  REPORT_*.md
  Report-*.md
  Knolayer.md
  reference/conscio_functions.md
  reference/claude-code-harness.md

nav:
  - Home: index.md
  - Guides:
      - Install: guides/install.md
      - Quickstart: guides/quickstart.md
      - Architecture: guides/architecture.md
      - Plugins & extension points: guides/plugins.md
      - Safety rules: guides/safety-rules.md
      - Consuming awake output: guides/integration.md
      - MCP server (embodiment): guides/mcp.md
      - Hub: guides/hub.md
      - Noosphere (society): guides/noosphere.md
      - Observatory (read-only view): guides/observatory.md
      - Liaison (cross-agent review): guides/liaison.md
  - Workflows:
      - Continuous learning: guides/workflows/continuous-learning.md
      - Architecture audit: guides/workflows/architecture-audit.md
      - Introspection & debugging: guides/workflows/introspection-debugging.md
  - Reference:
      - Public API: reference/public-api.md
      - Vector backends & migration: MIGRATION.md
  - Claims ledger: CLAIMS.md
  - Bench:
      - v1.0.0: bench/v1.0.0-bench.md
      - v1.2 campaign: bench/v1.2-campaign.md
      - v1.2 skill curve: bench/v1.2-skill-curve.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
